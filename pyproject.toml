[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diaphragm-material-rag"
version = "0.1.0"
description = "An educational RAG project for materials engineering knowledge retrieval"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Diaphragm Material RAG contributors" }]
license = { text = "MIT" }
keywords = ["rag", "retrieval", "embeddings", "vector-search", "python"]
dependencies = [
    "pytest>=8.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8", "numpy>=1.24"]
local-embeddings = ["sentence-transformers>=3.0"]
aws = ["boto3>=1.34"]
llm = ["anthropic>=1.0", "openai>=1.0"]
tracking = ["mlflow>=3.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# HTTP clients the API tests use: Starlette's TestClient needs httpx2; the real-server test uses httpx.
test = ["httpx>=0.27", "httpx2>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Only tests/: a script named *_test.py elsewhere was collected and put scripts/ on sys.path,
# so `import agent` resolved to scripts/agent.py instead of the package in src/.
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
