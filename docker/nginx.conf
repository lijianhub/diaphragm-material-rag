# Static files for the React app, and /api proxied to the BFF.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # nginx is the edge: replace any X-Forwarded-For the client sent. Appending
        # ($proxy_add_x_forwarded_for) let a client put a fake address first and get a fresh
        # rate limit on every request (found by testing the running stack).
        proxy_set_header X-Forwarded-For $remote_addr;
        # Server-Sent Events: pass every chunk through at once instead of buffering the answer.
        proxy_buffering off;
        proxy_cache off;
        # Agent runs and approvals take several model turns.
        proxy_read_timeout 300s;
        client_max_body_size 64k;
    }

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app's routes (/, /ops) all serve index.html; never cache it, so a deploy is seen at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
